name: Feature
description: Define a ready, independently valuable capability.
title: "[FEAT-NNNN] "
labels: ["type:feature", "priority:p2"]
body:
  - type: input
    id: work_id
    attributes:
      label: Work ID
      placeholder: FEAT-0001
    validations:
      required: true
  - type: textarea
    id: problem_outcome
    attributes:
      label: Problem and intended outcome
      description: State the problem, value, scope, and non-goals.
    validations:
      required: true
  - type: textarea
    id: contracts
    attributes:
      label: Domain and boundary contracts
      description: Include invariants, semantic types, units, nullability, errors, consumers, and compatibility.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria and test states
      description: Link TEST-NNNN scenarios and state test-code and baseline-run status.
    validations:
      required: true
  - type: textarea
    id: scenario_intent
    attributes:
      label: Numbered scenario intent review
      description: Identify the nearest same-contract sibling, compare contract, risk, evidence level, and exercised boundary, and classify the relationship as Distinct, ParameterizedVariant, InfrastructureContract, or SupersededDuplicate.
    validations:
      required: true
  - type: textarea
    id: decomposition
    attributes:
      label: Decomposition, dependencies, and risks
      description: Link child work, decisions, dependencies, and owned RISK-NNNN records.
    validations:
      required: true
  - type: textarea
    id: prior_art_recurrence
    attributes:
      label: Prior-art and recurrence evidence
      description: "Follow the [approved recurrence readiness evidence](https://github.com/hasanmanzak/meAndAI/blob/b55fc072caf96672a73f697002d2a2028c528da1/docs/features/FEAT-0051-v0150-recurrence-prevention-modular-test-harness/README.md#readiness-evidence) and [canonical ownership decision](https://github.com/hasanmanzak/meAndAI/blob/b55fc072caf96672a73f697002d2a2028c528da1/docs/decisions/DEC-0029-canonical-recurrence-knowledge-and-test-harness-ownership.md#decision). Matching active entry or explicit None; link the canonical owner and same-contract sibling surfaces, and record any failed route plus new evidence, an explicit retry contract, a materially different route, or a Blocked outcome."
    validations:
      required: true
  - type: textarea
    id: references
    attributes:
      label: Related records
      description: Use clickable links to the exact referenced records; free-text identifiers, numbers, titles, paths, or commit hashes do not satisfy a reference.
    validations:
      required: true
