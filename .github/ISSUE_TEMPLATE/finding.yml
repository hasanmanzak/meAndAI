name: Review finding
description: Record an evidence-backed audit or self-review observation.
title: "[FIND-NNNN] "
labels: ["type:finding"]
body:
  - type: input
    id: work_id
    attributes:
      label: Finding ID
      placeholder: FIND-0001
    validations:
      required: true
  - type: dropdown
    id: disposition
    attributes:
      label: Disposition
      options:
        - Blocking
        - AcceptedResidual
        - ExternalOrLegacyFollowUp
        - OptionalImprovement
    validations:
      required: true
  - type: dropdown
    id: classification
    attributes:
      label: Finding classification
      options:
        - Confirmed defect
        - Risk
        - Optional improvement
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: Category
      options:
        - Correctness
        - Architecture
        - Refactor
        - Duplication
        - Test gap
        - Documentation drift
        - Security or privacy
        - Performance or operations
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - critical
        - high
        - medium
        - low
        - info
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: Queue priority
      description: Select the queue priority; p0 is highest. Apply the matching repository label after triage.
      options:
        - p0
        - p1
        - p2
        - p3
    validations:
      required: true
  - type: dropdown
    id: impact_rank
    attributes:
      label: Impact rank
      options:
        - critical
        - high
        - medium
        - low
        - info
    validations:
      required: true
  - type: dropdown
    id: confidence
    attributes:
      label: Confidence
      options:
        - high
        - medium
        - low
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Finding dependencies
      description: Link prerequisite FIND-NNNN records, or write None.
      placeholder: None
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence and affected scope
      description: Cite files, lines, behavior, and commands; redact secrets and unnecessary personal data.
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Impact rationale and recommended action
      description: Explain the impact rank, why it matters, and the smallest safe remediation.
    validations:
      required: true
  - type: textarea
    id: prior_art_recurrence
    attributes:
      label: Prior-art and recurrence evidence
      description: "Follow the [approved recurrence readiness evidence](https://github.com/hasanmanzak/meAndAI/blob/b55fc072caf96672a73f697002d2a2028c528da1/docs/features/FEAT-0051-v0150-recurrence-prevention-modular-test-harness/README.md#readiness-evidence) and [canonical ownership decision](https://github.com/hasanmanzak/meAndAI/blob/b55fc072caf96672a73f697002d2a2028c528da1/docs/decisions/DEC-0029-canonical-recurrence-knowledge-and-test-harness-ownership.md#decision). Matching active entry or explicit None; link the canonical owner and same-contract sibling surfaces, and record any failed route plus new evidence, an explicit retry contract, a materially different route, or a Blocked outcome."
    validations:
      required: true
  - type: textarea
    id: references
    attributes:
      label: Related records
      description: Use clickable links to the exact referenced records; free-text identifiers, numbers, titles, paths, or commit hashes do not satisfy a reference.
    validations:
      required: true
