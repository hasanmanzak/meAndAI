name: Bug
description: Report confirmed incorrect behavior with reproduction evidence.
title: "[BUG-NNNN] "
labels: ["type:bug", "priority:p2"]
body:
  - type: input
    id: work_id
    attributes:
      label: Work ID
      placeholder: BUG-0001
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Actual and expected behavior
      description: Separate observed behavior from the expected contract.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction and evidence
      description: Include environment, minimal steps, redacted logs/files, clickable exact full-SHA commit permalinks, and frequency; never paste secrets or unnecessary personal data.
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Impact and suspected scope
      description: State affected users, domain invariants, severity, and compatibility risk.
    validations:
      required: true
  - type: textarea
    id: tests
    attributes:
      label: Regression scenarios
      description: Link numbered TEST-NNNN scenarios that fail before the fix.
    validations:
      required: true
  - type: textarea
    id: prior_art_recurrence
    attributes:
      label: Prior-art and recurrence evidence
      description: "Follow the [approved recurrence readiness evidence](https://github.com/hasanmanzak/meAndAI/blob/b55fc072caf96672a73f697002d2a2028c528da1/docs/features/FEAT-0051-v0150-recurrence-prevention-modular-test-harness/README.md#readiness-evidence) and [canonical ownership decision](https://github.com/hasanmanzak/meAndAI/blob/b55fc072caf96672a73f697002d2a2028c528da1/docs/decisions/DEC-0029-canonical-recurrence-knowledge-and-test-harness-ownership.md#decision). Matching active entry or explicit None; link the canonical owner and same-contract sibling surfaces, and record any failed route plus new evidence, an explicit retry contract, a materially different route, or a Blocked outcome."
    validations:
      required: true
  - type: textarea
    id: references
    attributes:
      label: Related records
      description: Use clickable links to the exact referenced records; free-text identifiers, numbers, titles, paths, or commit hashes do not satisfy a reference.
    validations:
      required: true
