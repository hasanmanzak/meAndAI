name: Subfeature
description: Define an independently reviewable and testable feature slice.
title: "[SUBF-NNNN] "
labels: ["type:subfeature", "priority:p2"]
body:
  - type: input
    id: work_id
    attributes:
      label: Work ID
      placeholder: SUBF-0001
    validations:
      required: true
  - type: input
    id: parent
    attributes:
      label: Parent feature
      description: Link the owning FEAT-NNNN issue and feature document.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Outcome, scope, and contracts
      description: State the slice, non-goals, invariants, semantic types, boundaries, and consumers.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria and tests
      description: Link numbered TEST-NNNN scenarios and state test-code and baseline-run status.
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies and risks
      description: Link blocking work, decisions, and owned RISK-NNNN records.
    validations:
      required: true
  - type: textarea
    id: prior_art_recurrence
    attributes:
      label: Prior-art and recurrence evidence
      description: "Follow the [approved recurrence readiness evidence](https://github.com/hasanmanzak/meAndAI/blob/b55fc072caf96672a73f697002d2a2028c528da1/docs/features/FEAT-0051-v0150-recurrence-prevention-modular-test-harness/README.md#readiness-evidence) and [canonical ownership decision](https://github.com/hasanmanzak/meAndAI/blob/b55fc072caf96672a73f697002d2a2028c528da1/docs/decisions/DEC-0029-canonical-recurrence-knowledge-and-test-harness-ownership.md#decision). Matching active entry or explicit None; link the canonical owner and same-contract sibling surfaces, and record any failed route plus new evidence, an explicit retry contract, a materially different route, or a Blocked outcome."
    validations:
      required: true
  - type: textarea
    id: references
    attributes:
      label: Related records
      description: Use clickable links to the exact referenced records; free-text identifiers, numbers, titles, paths, or commit hashes do not satisfy a reference.
    validations:
      required: true
