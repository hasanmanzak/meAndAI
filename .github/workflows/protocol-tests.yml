name: Protocol validation

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      verify_post_publication:
        description: Verify an already-published release and its external evidence
        required: false
        default: false
        type: boolean
      release_tag:
        description: Canonical published release tag
        required: false
        type: string
      expected_commit:
        description: Exact lowercase release commit SHA
        required: false
        type: string
      feature_path:
        description: Canonical feature README path
        required: false
        type: string
      issue_number:
        description: Closed delivery issue number
        required: false
        type: string
      owned_branch:
        description: Owned work branch that must have been deleted
        required: false
        type: string

permissions:
  contents: read

jobs:
  linux-validation:
    name: Validate on ubuntu-latest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Install checksummed actionlint v1.7.12
        shell: bash
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          binary="$RUNNER_TEMP/actionlint"
          curl --fail --silent --show-error --location \
            --output "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          printf '%s  %s\n' "$ACTIONLINT_SHA256" "$archive" | sha256sum --check --strict
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP" actionlint
          chmod 0755 "$binary"
          "$binary" -version
          printf 'ACTIONLINT=%s\n' "$binary" >> "$GITHUB_ENV"
      - name: Run actionlint semantic workflow validation
        shell: bash
        run: >-
          "$ACTIONLINT" -shellcheck= -pyflakes=
          .github/workflows/protocol-tests.yml
          templates/project/.github/workflows/meandai-protocol-update.yml
      - name: Parse consumer workflow YAML
        shell: bash
        run: ruby -e "require 'yaml'; YAML.load_file('templates/project/.github/workflows/meandai-protocol-update.yml')"
      - name: Run protocol validation on PowerShell 7
        shell: pwsh
        run: ./tests/protocol.tests.ps1

  windows-base:
    name: Windows base validation
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Run protocol validation on Windows PowerShell 5.1
        shell: powershell
        run: ./tests/protocol.tests.ps1 -ExecutionProfile WindowsBase

  windows-quick-adoption:
    name: Windows quick adoption (${{ matrix.shard }})
    strategy:
      fail-fast: false
      matrix:
        shard:
          - ContractsPreflight
          - AdoptionLifecycle
          - IntegrityFailures
          - RepositoryRoutes
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Run quick-adoption compatibility shard on Windows PowerShell 5.1
        shell: powershell
        run: ./tests/quick-adoption.tests.ps1 -Shard '${{ matrix.shard }}'

  windows-validation:
    name: Validate on windows-latest
    if: always()
    needs:
      - windows-base
      - windows-quick-adoption
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every Windows compatibility shard
        shell: bash
        env:
          WINDOWS_BASE_RESULT: ${{ needs.windows-base.result }}
          WINDOWS_QUICK_RESULT: ${{ needs.windows-quick-adoption.result }}
        run: |
          test "$WINDOWS_BASE_RESULT" = success
          test "$WINDOWS_QUICK_RESULT" = success

  post-publication:
    name: Verify published release evidence
    if: github.event_name == 'workflow_dispatch' && inputs.verify_post_publication
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
    steps:
      - name: Check out verifier
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Verify authoritative post-publication evidence
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MEANDAI_RELEASE_TAG: ${{ inputs.release_tag }}
          MEANDAI_EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          MEANDAI_FEATURE_PATH: ${{ inputs.feature_path }}
          MEANDAI_ISSUE_NUMBER: ${{ inputs.issue_number }}
          MEANDAI_OWNED_BRANCH: ${{ inputs.owned_branch }}
        run: |
          ./tests/Verify-PostPublicationEvidence.ps1 `
            -Repository '${{ github.repository }}' `
            -Tag $env:MEANDAI_RELEASE_TAG `
            -ExpectedCommit $env:MEANDAI_EXPECTED_COMMIT `
            -FeaturePath $env:MEANDAI_FEATURE_PATH `
            -IssueNumber $env:MEANDAI_ISSUE_NUMBER `
            -OwnedBranch $env:MEANDAI_OWNED_BRANCH
