name: Protocol validation

on:
  pull_request:
  merge_group:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      verify_post_publication:
        description: Verify an already-published release and its external evidence
        required: false
        default: false
        type: boolean
      release_tag:
        description: Canonical published release tag
        required: false
        type: string
      expected_commit:
        description: Exact lowercase release commit SHA
        required: false
        type: string
      feature_path:
        description: Canonical feature README path
        required: false
        type: string
      issue_number:
        description: Closed delivery issue number
        required: false
        type: string
      owned_branch:
        description: Owned work branch that must have been deleted
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ format('{0}-{1}', github.workflow, github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('{0}-{1}', github.event_name, github.run_id)) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  linux-validation:
    name: Validate on ubuntu-latest
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.verify_post_publication) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Install checksummed actionlint v1.7.12
        shell: bash
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          binary="$RUNNER_TEMP/actionlint"
          curl --fail --silent --show-error --location \
            --output "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          printf '%s  %s\n' "$ACTIONLINT_SHA256" "$archive" | sha256sum --check --strict
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP" actionlint
          chmod 0755 "$binary"
          "$binary" -version
          printf 'ACTIONLINT=%s\n' "$binary" >> "$GITHUB_ENV"
      - name: Run actionlint semantic workflow validation
        shell: bash
        run: >-
          "$ACTIONLINT" -shellcheck= -pyflakes=
          .github/workflows/protocol-tests.yml
          templates/project/.github/workflows/meandai-protocol-update.yml
      - name: Parse consumer workflow YAML
        shell: bash
        run: ruby -e "require 'yaml'; YAML.load_file('templates/project/.github/workflows/meandai-protocol-update.yml')"
      - name: Run protocol validation on PowerShell 7
        shell: pwsh
        run: ./tests/protocol.tests.ps1

  windows-validation:
    name: Validate on windows-latest
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.verify_post_publication) }}
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository and comparison commits
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select fail-safe Windows validation profile
        id: windows-profile
        shell: powershell
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_COMMIT: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
          HEAD_COMMIT: ${{ github.event.pull_request.head.sha || github.event.after || github.sha }}
        run: |
          $profile = @(
            ./tests/Select-WindowsValidationProfile.ps1 `
              -EventName $env:EVENT_NAME `
              -BaseCommit $env:BASE_COMMIT `
              -HeadCommit $env:HEAD_COMMIT
          )
          if ($profile.Count -ne 1 -or
              $profile[0] -cnotin @('Full', 'WindowsNative')) {
            throw 'Windows validation profile selection returned invalid evidence.'
          }
          "profile=$($profile[0])" | Out-File `
            -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "Selected Windows validation profile: $($profile[0])"
      - name: Run selected validation on Windows PowerShell 5.1
        shell: powershell
        run: >-
          ./tests/protocol.tests.ps1
          -ExecutionProfile '${{ steps.windows-profile.outputs.profile }}'

  post-publication:
    name: Verify published release evidence
    if: github.event_name == 'workflow_dispatch' && inputs.verify_post_publication
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
    steps:
      - name: Check out verifier
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Verify authoritative post-publication evidence
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MEANDAI_RELEASE_TAG: ${{ inputs.release_tag }}
          MEANDAI_EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          MEANDAI_FEATURE_PATH: ${{ inputs.feature_path }}
          MEANDAI_ISSUE_NUMBER: ${{ inputs.issue_number }}
          MEANDAI_OWNED_BRANCH: ${{ inputs.owned_branch }}
        run: |
          ./tests/Verify-PostPublicationEvidence.ps1 `
            -Repository '${{ github.repository }}' `
            -Tag $env:MEANDAI_RELEASE_TAG `
            -ExpectedCommit $env:MEANDAI_EXPECTED_COMMIT `
            -FeaturePath $env:MEANDAI_FEATURE_PATH `
            -IssueNumber $env:MEANDAI_ISSUE_NUMBER `
            -OwnedBranch $env:MEANDAI_OWNED_BRANCH
