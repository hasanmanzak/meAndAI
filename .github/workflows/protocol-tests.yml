name: Protocol validation

on:
  pull_request:
  merge_group:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      verify_post_publication:
        description: Verify an already-published release and its external evidence
        required: false
        default: false
        type: boolean
      release_tag:
        description: Canonical published release tag
        required: false
        type: string
      expected_commit:
        description: Exact lowercase release commit SHA
        required: false
        type: string
      feature_path:
        description: Canonical feature README path
        required: false
        type: string
      issue_number:
        description: Closed delivery issue number
        required: false
        type: string
      pull_request_number:
        description: Merged delivery pull request number
        required: false
        type: string
      owned_branch:
        description: Owned work branch that must have been deleted
        required: false
        type: string

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: ${{ format('{0}-{1}', github.workflow, github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('{0}-{1}', github.event_name, github.run_id)) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  linux-validation:
    name: Validate on ubuntu-latest
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.verify_post_publication) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select fail-closed main validation route
        id: main-route
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_COMMIT: ${{ github.event.before || '' }}
          AFTER_COMMIT: ${{ github.event.after || github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch || 'main' }}
        run: |
          Import-Module ./tests/capabilities/workflow-efficiency/MeAndAI.MainValidationRoute.psm1 -Force
          $route = @(
            Resolve-MeAndAIMainValidationRoute `
              -EventName $env:EVENT_NAME `
              -Repository '${{ github.repository }}' `
              -DefaultBranch $env:DEFAULT_BRANCH `
              -BeforeCommit $env:BEFORE_COMMIT `
              -AfterCommit $env:AFTER_COMMIT `
              -RepositoryRoot $env:GITHUB_WORKSPACE
          )
          if ($route.Count -ne 1 -or
              $route[0] -cnotin @('Full', 'ReuseExactValidatedTree')) {
            throw 'Main validation route returned invalid evidence.'
          }
          "route=$($route[0])" | Out-File `
            -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "Selected main validation route: $($route[0])"
      - name: Set up pinned .NET 10 SDK
        if: steps.main-route.outputs.route == 'Full'
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5.2.0
        with:
          dotnet-version: 10.0.302
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - name: Restore locked .NET dependencies
        if: steps.main-route.outputs.route == 'Full'
        shell: bash
        run: >-
          dotnet restore MeAndAI.Operations.slnx
          --configfile NuGet.Config
          --locked-mode
      - name: Run C# operational foundation tests
        if: steps.main-route.outputs.route == 'Full'
        shell: bash
        run: >-
          dotnet test MeAndAI.Operations.slnx
          --configuration Release
          --no-restore
          --nologo
          --verbosity minimal
          --filter "Scenario=TEST-0191|Scenario=TEST-0192|Scenario=TEST-0193"
      - name: Build exact portable operations package set
        if: steps.main-route.outputs.route == 'Full'
        shell: bash
        env:
          PACKAGE_ROOT: ${{ runner.temp }}/meandai-operations-packages
        run: |
          source_commit="$(git rev-parse HEAD)"
          dotnet run \
            --project tools/MeAndAI.Operations.Packaging/MeAndAI.Operations.Packaging.csproj \
            --configuration Release \
            --no-build \
            -- \
            pack \
            --repository-root "$GITHUB_WORKSPACE" \
            --inventory packaging/operations-packages.json \
            --output "$PACKAGE_ROOT" \
            --source-commit "$source_commit"
      - name: Verify and run portable operations package set on Linux
        if: steps.main-route.outputs.route == 'Full'
        shell: bash
        env:
          PACKAGE_ROOT: ${{ runner.temp }}/meandai-operations-packages
        run: >-
          dotnet run
          --project tools/MeAndAI.Operations.Packaging/MeAndAI.Operations.Packaging.csproj
          --configuration Release
          --no-build
          --
          verify
          --inventory packaging/operations-packages.json
          --manifest "$PACKAGE_ROOT/maai-operations-release-manifest.json"
          --assets "$PACKAGE_ROOT"
          --execute
      - name: Upload exact portable operations package set
        if: steps.main-route.outputs.route == 'Full'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: meandai-operations-${{ github.run_id }}
          path: ${{ runner.temp }}/meandai-operations-packages/*
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
      - name: Install checksummed actionlint v1.7.12
        if: steps.main-route.outputs.route == 'Full'
        shell: bash
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          binary="$RUNNER_TEMP/actionlint"
          curl --fail --silent --show-error --location \
            --output "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          printf '%s  %s\n' "$ACTIONLINT_SHA256" "$archive" | sha256sum --check --strict
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP" actionlint
          chmod 0755 "$binary"
          "$binary" -version
          printf 'ACTIONLINT=%s\n' "$binary" >> "$GITHUB_ENV"
      - name: Run actionlint semantic workflow validation
        if: steps.main-route.outputs.route == 'Full'
        shell: bash
        run: >-
          "$ACTIONLINT" -shellcheck= -pyflakes=
          .github/workflows/protocol-tests.yml
          templates/project/.github/workflows/meandai-protocol-update.yml
      - name: Parse consumer workflow YAML
        if: steps.main-route.outputs.route == 'Full'
        shell: bash
        run: ruby -e "require 'yaml'; YAML.load_file('templates/project/.github/workflows/meandai-protocol-update.yml')"
      - name: Run protocol validation on PowerShell 7
        if: steps.main-route.outputs.route == 'Full'
        shell: pwsh
        run: ./tests/protocol.tests.ps1
      - name: Verify exact reused tree structure on PowerShell 7
        if: steps.main-route.outputs.route == 'ReuseExactValidatedTree'
        shell: pwsh
        run: ./tests/protocol.tests.ps1 -StructureOnly

  windows-validation:
    name: Validate on windows-latest
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.verify_post_publication) }}
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository and comparison commits
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select fail-closed main validation route
        id: main-route
        shell: powershell
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_COMMIT: ${{ github.event.before || '' }}
          AFTER_COMMIT: ${{ github.event.after || github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch || 'main' }}
        run: |
          Import-Module ./tests/capabilities/workflow-efficiency/MeAndAI.MainValidationRoute.psm1 -Force
          $route = @(
            Resolve-MeAndAIMainValidationRoute `
              -EventName $env:EVENT_NAME `
              -Repository '${{ github.repository }}' `
              -DefaultBranch $env:DEFAULT_BRANCH `
              -BeforeCommit $env:BEFORE_COMMIT `
              -AfterCommit $env:AFTER_COMMIT `
              -RepositoryRoot $env:GITHUB_WORKSPACE
          )
          if ($route.Count -ne 1 -or
              $route[0] -cnotin @('Full', 'ReuseExactValidatedTree')) {
            throw 'Main validation route returned invalid evidence.'
          }
          "route=$($route[0])" | Out-File `
            -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "Selected main validation route: $($route[0])"
      - name: Select fail-safe Windows validation profile
        id: windows-profile
        if: steps.main-route.outputs.route == 'Full'
        shell: powershell
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_COMMIT: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
          HEAD_COMMIT: ${{ github.event.pull_request.head.sha || github.event.after || github.sha }}
        run: |
          $profile = @(
            ./tests/capabilities/windows-validation/Select-WindowsValidationProfile.ps1 `
              -EventName $env:EVENT_NAME `
              -BaseCommit $env:BASE_COMMIT `
              -HeadCommit $env:HEAD_COMMIT
          )
          if ($profile.Count -ne 1 -or
              $profile[0] -cnotin @('Full', 'WindowsNative')) {
            throw 'Windows validation profile selection returned invalid evidence.'
          }
          "profile=$($profile[0])" | Out-File `
            -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "Selected Windows validation profile: $($profile[0])"
      - name: Set up pinned .NET 10 SDK
        if: steps.main-route.outputs.route == 'Full'
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5.2.0
        with:
          dotnet-version: 10.0.302
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - name: Restore locked .NET dependencies
        if: steps.main-route.outputs.route == 'Full'
        shell: pwsh
        run: >-
          dotnet restore MeAndAI.Operations.slnx
          --configfile NuGet.Config
          --locked-mode
      - name: Run C# operational foundation tests
        if: steps.main-route.outputs.route == 'Full'
        shell: pwsh
        run: >-
          dotnet test MeAndAI.Operations.slnx
          --configuration Release
          --no-restore
          --nologo
          --verbosity minimal
          --filter "Scenario=TEST-0191|Scenario=TEST-0192|Scenario=TEST-0193"
      - name: Run runtime-efficiency contract on Windows PowerShell 7
        if: steps.main-route.outputs.route == 'Full'
        shell: pwsh
        run: >-
          ./tests/capabilities/test-runtime-efficiency/test-runtime-efficiency.tests.ps1
      - name: Run selected validation on Windows PowerShell 5.1
        if: steps.main-route.outputs.route == 'Full'
        shell: powershell
        run: >-
          ./tests/protocol.tests.ps1
          -ExecutionProfile '${{ steps.windows-profile.outputs.profile }}'
      - name: Download exact Linux-built operations package set
        if: steps.main-route.outputs.route == 'Full'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: meandai-operations-${{ github.run_id }}
          path: ${{ runner.temp }}/meandai-operations-packages
      - name: Verify and run the same operations package set on Windows
        if: steps.main-route.outputs.route == 'Full'
        shell: pwsh
        env:
          PACKAGE_ROOT: ${{ runner.temp }}\meandai-operations-packages
        run: >-
          dotnet run
          --project tools/MeAndAI.Operations.Packaging/MeAndAI.Operations.Packaging.csproj
          --configuration Release
          --no-build
          --
          verify
          --inventory packaging/operations-packages.json
          --manifest "$env:PACKAGE_ROOT\maai-operations-release-manifest.json"
          --assets "$env:PACKAGE_ROOT"
          --execute
      - name: Verify exact reused tree structure on Windows PowerShell 5.1
        if: steps.main-route.outputs.route == 'ReuseExactValidatedTree'
        shell: powershell
        run: ./tests/protocol.tests.ps1 -StructureOnly

  post-publication:
    name: Verify published release evidence
    if: github.event_name == 'workflow_dispatch' && inputs.verify_post_publication
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - name: Check out current verifier authority
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify authoritative post-publication evidence
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MEANDAI_RELEASE_TAG: ${{ inputs.release_tag }}
          MEANDAI_EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          MEANDAI_FEATURE_PATH: ${{ inputs.feature_path }}
          MEANDAI_ISSUE_NUMBER: ${{ inputs.issue_number }}
          MEANDAI_PULL_REQUEST_NUMBER: ${{ inputs.pull_request_number }}
          MEANDAI_OWNED_BRANCH: ${{ inputs.owned_branch }}
        run: |
          $verifierRoot = (Get-Location).Path
          $targetWorktree = Join-Path $env:RUNNER_TEMP `
            ('meandai-release-evidence-' + [guid]::NewGuid().ToString('N'))
          $worktreeAdded = $false
          $arguments = @{
            Repository = '${{ github.repository }}'
            Tag = $env:MEANDAI_RELEASE_TAG
            ExpectedCommit = $env:MEANDAI_EXPECTED_COMMIT
            FeaturePath = $env:MEANDAI_FEATURE_PATH
            IssueNumber = $env:MEANDAI_ISSUE_NUMBER
            PullRequestNumber = $env:MEANDAI_PULL_REQUEST_NUMBER
            OwnedBranch = $env:MEANDAI_OWNED_BRANCH
          }
          if ([version]$env:MEANDAI_RELEASE_TAG.Substring(1) -ge [version]'0.12.4') {
            $arguments.ExpectedReleaseAssetNames = @(
              'Invoke-MeAndAIQuickAdoption.ps1',
              'MeAndAI.QuickAdoption.Bundle.zip'
            )
            $arguments.ExpectedBundleAssetName = 'MeAndAI.QuickAdoption.Bundle.zip'
            $arguments.ExpectedBundleSourceInventoryPath = `
              'scripts/quick-adoption/bundle.sources.json'
          }
          try {
            & git -C $verifierRoot worktree add --detach -- `
              $targetWorktree $env:MEANDAI_EXPECTED_COMMIT
            if ($LASTEXITCODE -ne 0) {
              throw 'The immutable release-evidence worktree could not be created.'
            }
            $worktreeAdded = $true
            Push-Location $targetWorktree
            try {
              $verifierPath = Join-Path $verifierRoot `
                'tests/capabilities/publication-evidence/Verify-PostPublicationEvidence.ps1'
              & $verifierPath @arguments
            }
            finally {
              Pop-Location
            }
          }
          finally {
            if ($worktreeAdded) {
              & git -C $verifierRoot worktree remove --force -- $targetWorktree
              if ($LASTEXITCODE -ne 0) {
                throw 'The immutable release-evidence worktree could not be removed.'
              }
            }
          }
